services:
  bicho:
    build: .
    ports:
      - "8000:8000"
    # Secrets come from a local .env you create from .env.example; nothing sensitive lives here.
    env_file:
      - .env
    environment:
      BICHO_ENVIRONMENT: local
      PORT: "8000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
